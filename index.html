<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF6A2B'/%3E%3Cpath d='M8 26V14l8-6 8 6v12M13 26v-6h6v6' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Laboratório de Roteiros Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fintech-dashboard dark UI — glass top bar with centered tabs → centered hero with orange arc glow → one 1180px column of soft dark cards; Roteiros and Ganchos are two-pane */
:root{
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1C1C1F; --sunk:#1E1E22; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.065);
  --ink:#F4F4F5; --muted:#A1A1AA; --faint:#6E6E77;
  --acc:#FF6A2B; --acc-2:#FF8A55;
  --navy:#FF6A2B; --navy-ink:#FFFFFF; --navy-soft:rgba(255,106,43,.12);
  --green:#3DD68C; --green-bright:#FF6A2B; --green-soft:rgba(61,214,140,.10);
  --amber:#F5B14C; --amber-soft:rgba(245,177,76,.12); --red:#FF6B6B; --red-soft:rgba(255,107,107,.12);
  --bar2:#8C8C95;
  --mast-bg:#0A0A0B; --mast-ink:#FFFFFF; --mast-muted:#A1A1AA; --stripe:#0A0A0B;
  --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 48px -28px rgba(0,0,0,.9);
  --f-display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --g1:#FF7A3D;--g2:#F0541E;--g3:#E6461A;--acc-rgb:255,106,43;--glow-rgb:255,91,31;--glow2-rgb:255,140,90;--glow3-rgb:255,120,60;--k1:#FF8A55;--k2:#F2561F;--k3:#B83A12;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-stretch:80%}
h2{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.18rem;font-weight:700}
p{margin:0}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--green-bright);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* masthead */









.lang{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px}
.lang button{appearance:none;border:0;background:none;color:var(--mast-muted);font:700 .8rem var(--f-body);padding:6px 13px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button:hover{color:var(--mast-ink)}
.lang button[aria-pressed="true"]{background:var(--mast-ink);color:#16305A}



/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 4px 14px -12px rgba(17,28,46,.35)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 .9rem var(--f-body);padding:14px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green-bright)}
.tab[aria-selected="true"] .ico{stroke:var(--green)}
.tab .n{font-family:var(--f-mono);font-size:.68rem;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 7px}

main{padding-block:30px 72px}
section.view{display:grid;gap:22px}
.vhead{display:grid;gap:6px}
.vhead p{color:var(--muted);max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card > h3{margin-bottom:12px}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;line-height:1.6}
.chip.p{background:var(--navy-soft);color:var(--navy)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.hot{background:var(--red-soft);color:var(--red)}
.chip.mono{font-family:var(--f-mono);font-weight:500}

/* panorama */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:6px;align-content:start}
.kpi .v{font-family:var(--f-display);font-stretch:72%;font-weight:850;font-size:2.2rem;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:1rem;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .d{font-size:.82rem;color:var(--muted)}
.kpi.accent{background:var(--navy);border-color:var(--navy)}
.kpi.accent .v,.kpi.accent .d,.kpi.accent .eyebrow,.kpi.accent .v small{color:var(--navy-ink)}
.kpi.accent .d,.kpi.accent .eyebrow{opacity:.82}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line-soft);border-left:5px solid var(--green-bright);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.verdict .vi{width:40px;height:40px;border-radius:11px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.verdict h3{font-size:1.3rem;margin-bottom:6px}
.verdict .do{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.verdict .do span{font-size:.8rem;font-weight:600;background:var(--green-soft);color:var(--green);border-radius:8px;padding:5px 10px}
.verdict .rule-n{margin-top:10px}
.find ul{padding:0;margin:0;display:grid;gap:14px}
.find li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font-size:.93rem}
.find .k{font-family:var(--f-mono);font-size:.78rem;font-weight:500;color:var(--navy);background:var(--navy-soft);border-radius:8px;height:28px;display:grid;place-items:center}
.chart{display:grid;gap:10px}









.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top;white-space:nowrap}
td:first-child{white-space:normal;min-width:170px}
th{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;background:var(--sunk);border-bottom:0}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
tr.hi td{background:var(--green-soft)}
.scroll{overflow-x:auto}







/* controls */
.toolbar{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.bar label{display:grid;gap:5px;font-size:.66rem;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.07em}
select,input[type=search]{font:500 .9rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:0}
input[type=search]{width:min(260px,100%)}
.pillrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.pill{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .82rem var(--f-body);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--navy)}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.pill .c{font-family:var(--f-mono);font-size:.7rem;opacity:.7;margin-left:5px}
.cbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 .7rem var(--f-mono);border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.cbtn:hover{color:var(--ink);border-color:var(--navy)}
.cbtn.done{color:var(--green);border-color:var(--green)}
.btn{appearance:none;font:600 .85rem var(--f-body);border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--navy)}
.count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-left:auto;align-self:center}
.stsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:12px;overflow:hidden;border:1px solid var(--line-soft);background:var(--surface);box-shadow:var(--shadow)}
.stsum button{appearance:none;min-width:0;border:0;border-right:1px solid var(--line-soft);background:none;padding:12px 14px;text-align:left;cursor:pointer;color:var(--ink);display:grid;gap:2px}
.stsum button:last-child{border-right:0}
.stsum b{font-family:var(--f-display);font-stretch:72%;font-size:1.7rem;line-height:1;font-weight:850}
.stsum span{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.stsum i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stsum button[aria-pressed="true"]{background:var(--navy-soft)}

/* ideas */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.idea{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:18px;display:grid;gap:11px;align-content:start;min-width:0;box-shadow:var(--shadow);position:relative}
.idea.alta::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--green-bright)}
.idea .t{font-size:.8rem;color:var(--muted);font-weight:600}
.hook{font-family:var(--f-display);font-stretch:78%;font-size:1.22rem;font-weight:750;line-height:1.22}
.hook::before{content:"“";color:var(--green-bright)}
.hook::after{content:"”";color:var(--green-bright)}
.tr{font-size:.82rem;color:var(--muted);font-style:italic}
.idea ol{margin:0;padding-left:18px;font-size:.88rem;display:grid;gap:4px}
.idea .why{font-size:.82rem;background:var(--sunk);border-radius:9px;padding:9px 11px;color:var(--muted)}
.idea .why b{color:var(--ink);font-weight:600}
.idea .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.status{font:600 .78rem var(--f-body);padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.idea[data-st="roteirizar"] .status{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.idea[data-st="gravado"] .status{background:var(--navy-soft);border-color:transparent;color:var(--navy)}
.idea[data-st="no-ar"] .status{background:var(--green-soft);border-color:transparent;color:var(--green)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* scripts */
.reader{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:22px;align-items:start}
.slist{display:grid;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.slist .eyebrow{margin:2px 2px 4px}
.sitem{appearance:none;text-align:left;border:1px solid var(--line-soft);background:var(--surface);border-radius:12px;padding:11px 13px;cursor:pointer;color:var(--ink);display:grid;grid-template-columns:26px 1fr;gap:3px 10px;align-items:start}
.sitem .no{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:3px}
.sitem .tt{font-family:var(--f-display);font-stretch:78%;font-weight:750;font-size:1.04rem;line-height:1.2}
.sitem .mm{grid-column:2;font-size:.74rem;color:var(--muted)}
.sitem .first{color:var(--green);font-weight:700}
.sitem:hover{border-color:var(--line)}
.sitem[aria-current="true"]{border-color:var(--navy);background:var(--navy-soft)}
.sdetail{display:grid;gap:18px;min-width:0}
.shead{display:grid;gap:10px}
.shead h2{font-size:clamp(1.7rem,3.6vw,2.4rem);font-stretch:70%;font-weight:850}


.board{border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.board-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--sunk);flex-wrap:wrap}
.shot{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--line-soft)}
.tc{font-family:var(--f-mono);font-size:.8rem;color:var(--ink);padding:14px 12px;display:grid;align-content:start;gap:3px;border-right:1px solid var(--line-soft)}
.tc b{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.shot .c{padding:14px 16px;display:grid;gap:7px;min-width:0}
.say{font-size:1.04rem;line-height:1.45}
.who{display:inline-block;font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--green);background:var(--green-soft);border-radius:5px;padding:1px 6px;margin-right:8px;vertical-align:2px}
.meta-l{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:.82rem;color:var(--muted)}
.meta-l b{font-family:var(--f-mono);font-weight:500;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;padding-top:3px;color:var(--faint)}
.meta-l .ost{color:var(--ink);font-weight:700;font-size:.8rem;letter-spacing:.02em}
.copyrow{display:grid;grid-template-columns:140px 1fr auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line)}
.copyrow:last-child{border-bottom:0;padding-bottom:0}
.copyrow .l{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.copyrow .v{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere;font-size:.92rem}
.warnbox{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.88rem;background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:12px 14px}
.warnbox .ico{color:var(--amber)}
.es{font-family:var(--f-mono);font-size:.62rem;background:var(--sunk);border-radius:4px;padding:1px 5px;color:var(--ink);font-style:normal;margin-right:5px;vertical-align:1px}

/* hooks */
.hooklab{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:22px;align-items:start}
.pillars{display:grid;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.pbtn{appearance:none;text-align:left;border:1px solid var(--line-soft);background:var(--surface);color:var(--ink);border-radius:11px;padding:10px 13px;cursor:pointer;font:600 .9rem var(--f-body);display:flex;justify-content:space-between;gap:8px;align-items:center;white-space:nowrap}
.pbtn span{font:500 .72rem var(--f-mono);color:var(--muted);background:var(--sunk);border-radius:999px;padding:1px 7px}
.pbtn[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.pbtn[aria-pressed="true"] span{background:rgba(255,255,255,.2);color:var(--navy-ink)}
.hooks{display:grid;gap:10px;min-width:0}
.hk{display:grid;grid-template-columns:104px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.hk .f{font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--navy);background:var(--navy-soft);border-radius:6px;padding:4px 7px;text-align:center}
.hk .x{font-family:var(--f-display);font-stretch:78%;font-weight:750;font-size:1.14rem;line-height:1.25;min-width:0}
.hk .x .tr{font-family:var(--f-body);font-stretch:100%;font-weight:400;font-size:.8rem;display:block;margin-top:3px}
.formula{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.formula div{background:var(--sunk);border-radius:10px;padding:11px 13px;font-size:.85rem}
.formula b{display:block;font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);font-weight:500;margin-bottom:3px}

/* refs */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.ref{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.ref .top{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:1.05rem;color:#FFFFFF}
.av.ig{background:linear-gradient(135deg,#6E3AA8,#C93C74 55%,#D99032)}
.av.yt{background:#C4302B}
.av.tt{background:#151515;box-shadow:inset 3px 0 0 #25F4EE,inset -3px 0 0 #FE2C55}
.ref .nm{font-family:var(--f-display);font-stretch:78%;font-weight:750;font-size:1.1rem;line-height:1.15}
.ref .h{font-family:var(--f-mono);font-size:.74rem;overflow-wrap:anywhere;display:block;margin-top:2px}
.ref .fol{text-align:right;font-family:var(--f-display);font-stretch:72%;font-weight:850;font-size:1.35rem;line-height:1;white-space:nowrap}
.ref .fol small{display:block;font-family:var(--f-mono);font-size:.6rem;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.ref p{font-size:.88rem}
.ref .steal{font-size:.85rem;background:var(--green-soft);border-radius:9px;padding:9px 11px}
.ref .steal b{color:var(--green)}
.refgroup{display:grid;gap:12px}
.refgroup h2{display:flex;align-items:baseline;gap:10px}
.refgroup h2 span{font-family:var(--f-mono);font-size:.75rem;font-weight:400;color:var(--muted)}

/* method */
.tl{display:grid;grid-template-columns:4fr 6fr 26fr 6fr;border-radius:12px;overflow:hidden}
.tl div{padding:12px;min-width:0;display:grid;gap:3px;align-content:start}
.tl div:nth-child(1){background:var(--green-bright);color:#FFFFFF}
.tl div:nth-child(2){background:#1C3A6B;color:#FFFFFF}
.tl div:nth-child(3){background:var(--navy-soft);color:var(--ink)}
.tl div:nth-child(4){background:var(--green-soft);color:var(--ink)}
.tl .s{font-family:var(--f-mono);font-size:.7rem;opacity:.85}
.tl b{font-family:var(--f-display);font-stretch:78%;font-size:1.02rem}
.tlx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin-top:14px}
.tlx div{font-size:.86rem}
.tlx b{display:block;font-size:.68rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin-bottom:2px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-bottom:16px}
.rule{background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:6px}
.rule .f{font-size:.82rem}
.rule .gbar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red) 0 33%,var(--amber) 33% 66%,var(--green-bright) 66%)}
.rule .rng{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.74rem}
.rule .rng span:first-child{color:var(--red)} .rule .rng span:last-child{color:var(--green)}
.steps{counter-reset:s;display:grid;gap:12px;padding:0;margin:0}
.steps li{list-style:none;counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;font-size:.92rem}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:.78rem;background:var(--navy);color:var(--navy-ink);border-radius:8px;width:28px;height:28px;display:grid;place-items:center}
.checks{display:grid;gap:9px;padding:0;margin:0}
.checks li{list-style:none;display:grid;grid-template-columns:22px 1fr;gap:9px;font-size:.9rem}
.checks li::before{font-weight:700;border-radius:6px;width:20px;height:20px;display:grid;place-items:center;font-size:.72rem;margin-top:1px}
.checks.yes li::before{content:"✓";color:var(--green);background:var(--green-soft)}
.checks.no li::before{content:"✕";color:var(--red);background:var(--red-soft)}

/* panorama: instagram */
.ighead{display:grid;gap:14px}
.igid{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.igid .nm{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:1.25rem}
.igmeta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.84rem}
.igmeta b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.igimp{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.igimp .note{flex:1;min-width:200px}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn .ico{width:16px;height:16px}
.kpis.ig6{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi .dl{font-family:var(--f-mono);font-weight:500;border-radius:5px;padding:0 5px}
.kpi .dl.neg{background:var(--red-soft);color:var(--red)}
.kpi .dl.pos{background:var(--green-soft);color:var(--green)}
.kpi.mini{box-shadow:none;background:var(--sunk);border:0}
.kpi.mini .v{font-size:1.5rem}
.verdict.warn{border-left-color:var(--amber)}
.verdict.warn .vi{background:var(--amber-soft);color:var(--amber)}
.ch{width:100%;height:auto;display:block;overflow:visible}
.ch text{fill:var(--faint);font:500 11px var(--f-mono)}
.ch .gl{stroke:var(--line-soft);stroke-width:1}
.ch .gm{stroke:var(--line);stroke-dasharray:2 3}
.ch .cur{stroke:var(--ink);stroke-width:1;opacity:.5}
.ch .hit{fill:transparent;cursor:crosshair}
.igc .rd{font-size:.82rem;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-variant-numeric:tabular-nums}
.igc .rd i,.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
table.mt td small,table td small{display:block;font-size:.7rem;color:var(--muted)}
table.posts td.cap{white-space:normal;min-width:220px;max-width:340px}
table.posts td.cap a{color:var(--ink);text-decoration:none}
table.posts td.cap a:hover{text-decoration:underline}
.mb{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--sunk);margin-right:8px;vertical-align:middle;overflow:hidden}
.mb i{display:block;height:100%;background:var(--navy);border-radius:3px}

/* banco de ideias: alternador e stories */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:4px;box-shadow:var(--shadow);justify-self:start}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:600 .9rem var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.seg button .n{font-family:var(--f-mono);font-size:.68rem;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 7px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.seg button[aria-pressed="true"] .n{background:rgba(255,255,255,.2);color:var(--navy-ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--sunk);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.day b{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--navy)}
.day .dt{font-size:.82rem;font-weight:600;line-height:1.3}
.day .chip{white-space:normal}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px}
.stk{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.stk .sh{background:linear-gradient(90deg,#6E3AA8,#C93C74 55%,#D99032);color:#FFFFFF;font:500 .66rem var(--f-mono);letter-spacing:.1em;padding:6px 12px}
.stk .sb{padding:12px 14px;font-family:var(--f-display);font-stretch:78%;font-weight:750;font-size:1.14rem;line-height:1.25}
.stk .sb .tr{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:400;font-size:.8rem;margin-top:4px}
.story > *,#ibody > *{min-width:0}
.frames{display:grid;grid-auto-flow:column;grid-auto-columns:124px;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.frame{min-height:206px;border-radius:14px;background:linear-gradient(170deg,var(--navy-soft),var(--sunk) 70%);border:1px solid var(--line-soft);padding:9px 10px 12px;display:flex;flex-direction:column;gap:7px;font-size:.76rem;line-height:1.32}
.frame .pg{display:flex;gap:2px}
.frame .pg i{flex:1;height:2px;border-radius:2px;background:var(--line)}
.frame .pg i.on{background:var(--navy)}
.frame .fn{font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.frame .fx{overflow-wrap:anywhere}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.hlc{display:grid;justify-items:center;text-align:center;gap:6px}
.hlc .ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#6E3AA8,#C93C74 55%,#D99032)}
.hlc .ring span{width:100%;height:100%;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-family:var(--f-display);font-stretch:75%;font-weight:850;font-size:1.3rem;border:3px solid var(--surface)}
.hlc b{font-size:.88rem}
@media (max-width:860px){ .week{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))} }

@media (max-width:860px){
  .reader,.hooklab{grid-template-columns:1fr}
  .slist{position:static;grid-auto-flow:column;grid-auto-columns:minmax(210px,72%);grid-template-columns:none;overflow-x:auto;padding-bottom:6px}
  .slist .eyebrow{display:none}
  .pillars{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px}
  
  
}
@media (max-width:620px){
  
  
  
  .copyrow{grid-template-columns:1fr auto}
  .copyrow .l{grid-column:1/-1}
  .hk{grid-template-columns:1fr auto}
  .hk .f{grid-column:1/-1;justify-self:start}
  .shot{grid-template-columns:72px 1fr}
  .meta-l{grid-template-columns:1fr;gap:0}
  .verdict{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr 1fr}
  .stsum{grid-template-columns:1fr 1fr}
  .stsum button:nth-child(2){border-right:0}
  .stsum button:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}
  
  
}
@media (prefers-reduced-motion:no-preference){
  .idea,.ref,.hk,.sitem,.pill,.pbtn{transition:border-color .15s,background-color .15s}
}
/* ===== tema escuro (referência: dashboard fintech, preto + laranja) ===== */
html{background:var(--bg)}
body{background:radial-gradient(1200px 600px at 50% -200px,rgba(var(--acc-rgb),.10),transparent 70%),var(--bg);color:var(--ink);font-family:var(--f-body);letter-spacing:-.005em}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:100%;letter-spacing:-.02em}
h2{font-weight:500}
h3{font-weight:600;font-size:1.08rem}
a{color:var(--acc-2)}
::selection{background:rgba(var(--acc-rgb),.35)}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.78);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft);padding-top:env(safe-area-inset-top,0px)}
.topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:10px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:600 1rem var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--g1),var(--g3));display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(var(--acc-rgb),.7)}
.brand .logo svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{font-weight:600;color:var(--acc)}
#tabs{display:flex;justify-content:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 .86rem var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border-bottom:0}
.tab .ico{width:15px;height:15px}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tab[aria-selected="true"]{color:var(--acc-2);background:rgba(var(--acc-rgb),.10);border-bottom:0}
.tab[aria-selected="true"] .ico{stroke:var(--acc-2)}
.tab .n{background:rgba(255,255,255,.06);color:var(--muted)}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{appearance:none;border:0;background:none;color:var(--muted);font:600 .76rem var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#0A0A0B}

/* hero */







.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pillbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .9rem var(--f-body);border-radius:999px;padding:11px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pillbtn:hover{border-color:rgba(255,255,255,.22)}
.pillbtn.primary{background:linear-gradient(180deg,var(--g1),var(--g2));border-color:transparent;color:#fff;box-shadow:0 10px 30px -10px rgba(var(--acc-rgb),.8),inset 0 1px 0 rgba(255,255,255,.25)}
.pillbtn .ico{width:15px;height:15px}








main.wrap{position:relative;z-index:2;margin-top:-70px;padding-block:0 80px}

/* seções */
.vhead{justify-items:center;text-align:center;gap:10px;margin-bottom:6px}
.vhead h2{font-size:clamp(1.8rem,3.8vw,2.5rem);font-weight:500;line-height:1.1}
.vhead p{margin-inline:auto;max-width:62ch}
.card,.kpi,.idea,.ref,.hk,.toolbar,.verdict,.stsum,.board,.sitem,.pbtn,.seg,.empty{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%),var(--surface);border:1px solid var(--line-soft);box-shadow:var(--shadow)}
.card,.idea,.ref,.verdict,.board,.toolbar{border-radius:18px}
.kpi{border-radius:16px}
.kpi .v,.stsum b,.ref .fol,.sitem .tt,.shead h2,.hook,.hk .x,.stk .sb,.igid .nm,.ref .nm{font-family:var(--f-display);font-weight:500;letter-spacing:-.025em;font-stretch:100%}
.kpi .v{font-size:2rem}
.kpi.accent{background:radial-gradient(120% 120% at 0% 0%,var(--k1) 0%,var(--k2) 45%,var(--k3) 100%);border-color:transparent;box-shadow:0 20px 50px -24px rgba(var(--glow-rgb),.9),inset 0 1px 0 rgba(255,255,255,.25)}
.kpi.accent .v,.kpi.accent .d,.kpi.accent .eyebrow,.kpi.accent .v small{color:#fff}
.verdict{border-left:1px solid var(--line-soft);background:radial-gradient(70% 90% at 0% 0%,rgba(var(--acc-rgb),.22),transparent 70%),var(--surface)}
.verdict .vi{background:rgba(var(--acc-rgb),.14);color:var(--acc-2)}
.verdict .do span{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line)}
.verdict.warn{background:radial-gradient(70% 90% at 0% 0%,rgba(245,177,76,.18),transparent 70%),var(--surface)}
.find .k{background:rgba(var(--acc-rgb),.12);color:var(--acc-2)}
.chip{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line-soft)}
.chip.p{background:rgba(var(--acc-rgb),.12);color:var(--acc-2);border-color:rgba(var(--acc-rgb),.25)}
.chip.ok{background:rgba(61,214,140,.10);color:var(--green);border-color:rgba(61,214,140,.22)}
.chip.hot{background:rgba(var(--acc-rgb),.9);color:#fff;border-color:transparent}
.pill,.btn,.cbtn,.status,select,input[type=search]{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.pill,.btn{border-radius:999px}
.pill[aria-pressed="true"],.pbtn[aria-pressed="true"],.seg button[aria-pressed="true"],.sitem[aria-current="true"]{background:linear-gradient(180deg,var(--g1),var(--g2));border-color:transparent;color:#fff}

.seg{border-radius:999px;padding:4px;justify-self:center}
.seg button{border-radius:999px}
.btn.primary,label.btn.primary{background:linear-gradient(180deg,var(--g1),var(--g2));border-color:transparent;color:#fff}
.cbtn:hover,.pill:hover,.btn:hover{border-color:rgba(var(--acc-rgb),.6)}
.cbtn.done{color:var(--green);border-color:var(--green)}
th{background:rgba(255,255,255,.04);color:var(--faint)}
td{border-bottom-color:var(--line-soft)}
tr.hi td{background:rgba(var(--acc-rgb),.08)}






.idea .why,.formula div,.rule,.day,.kpi.mini{background:rgba(255,255,255,.035)}
.idea.alta::before{background:linear-gradient(90deg,var(--g3),var(--g1))}

.stsum button[aria-pressed="true"]{background:rgba(var(--acc-rgb),.10)}
.stsum{border-radius:16px}
.who{color:var(--acc-2);background:rgba(var(--acc-rgb),.12)}


.tc{border-right-color:var(--line-soft)}
.shot{border-top-color:var(--line-soft)}
.board-h{background:rgba(255,255,255,.035)}
.hk .f{background:rgba(var(--acc-rgb),.12);color:var(--acc-2)}
.formula b,.day b{color:var(--acc-2)}
.ref .steal{background:rgba(61,214,140,.07);border:1px solid rgba(61,214,140,.16)}

/* ===== v6: cor de destaque, metas, funil, vínculos, quadro, teleprompter, barra inferior ===== */
:root[data-accent="tower"]{--acc:#6CC04A;--acc-2:#8FD46E;--navy:#6CC04A;--green-bright:#6CC04A;--navy-soft:rgba(108,192,74,.12);
  --g1:#86D463;--g2:#4E8A2E;--g3:#3F7A22;--acc-rgb:108,192,74;--glow-rgb:94,170,60;--glow2-rgb:150,220,120;--glow3-rgb:110,200,80;--k1:#9BE07A;--k2:#5FA83A;--k3:#2F5A1C}
.tools{display:inline-flex;align-items:center;gap:8px}
.acc-tg{appearance:none;width:44px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:0;padding:0}
.acc-tg i{width:12px;height:12px;border-radius:50%;border:2px solid var(--surface)}
.acc-tg i:first-child{background:#FF6A2B;margin-right:-3px;z-index:1}
.acc-tg i:last-child{background:#6CC04A}
.acc-tg[aria-pressed="true"] i:first-child{z-index:0}
.acc-tg[aria-pressed="true"] i:last-child{z-index:1}
.acc-tg:hover{border-color:rgba(255,255,255,.22)}
.acc-tg:focus-visible,.tab:focus-visible,.vt button:focus-visible,.pillbtn:focus-visible{outline:2px solid var(--acc-2);outline-offset:2px}
.tab .ts{display:none}

/* hero só no Painel */

body:not([data-view="panorama"]) main.wrap{margin-top:0;padding-top:34px}

/* frescor dos dados */







.stalebar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:rgba(245,177,76,.10);border:1px solid rgba(245,177,76,.25);color:var(--amber);font-size:.88rem}
.stalebar .ico{width:18px;height:18px;flex:none;stroke:var(--amber)}
.limn{margin:-8px 2px 0;font-size:.8rem}


/* metas */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.goal{display:grid;gap:8px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);align-content:start}
.goal .gv{font:500 1.55rem var(--f-display);letter-spacing:-.025em}
.goal .gv small{font-size:.85rem;color:var(--muted);margin-left:2px}
.goal .gb{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.goal .gb i{display:block;height:100%;border-radius:99px;background:var(--faint)}
.goal.ok .gb i{background:var(--green)} .goal.ok .gv{color:var(--green)}
.goal.bad .gb i{background:var(--red)} .goal.bad .gv{color:var(--red)}

.goal .gm{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted)}
.goal .gm b{font-weight:500;color:var(--ink);white-space:nowrap}

/* funil */

















/* tabela de anúncios */




td.up,b.up{color:var(--green)} td.dn,b.dn{color:var(--red)}




/* vínculos */



















.flash{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:120;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.88rem;box-shadow:0 20px 40px -20px #000;transition:opacity .2s,transform .2s}
.flash.on{opacity:1;transform:translate(-50%,0)}

/* grade | quadro */
.vt{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-left:auto}
.vt button{appearance:none;border:0;background:none;color:var(--muted);font:500 .8rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.vt button .ico{width:14px;height:14px}
.vt button[aria-pressed="true"]{background:rgba(var(--acc-rgb),.16);color:var(--acc-2)}
.vt button[aria-pressed="true"] .ico{stroke:var(--acc-2)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.kbn{grid-column:1/-1;margin:0}
.kcol{display:grid;gap:10px;align-content:start;padding:10px;border-radius:16px;background:rgba(255,255,255,.025);border:1px dashed var(--line-soft);min-height:160px;min-width:0;transition:background-color .15s,border-color .15s}
.kcol.over{background:rgba(var(--acc-rgb),.08);border-color:rgba(var(--acc-rgb),.55)}
.kh{display:flex;align-items:center;gap:8px;font:600 .84rem var(--f-body);padding:4px 4px 2px}
.kh i{width:8px;height:8px;border-radius:50%}
.kh b{margin-left:auto;font:500 .78rem var(--f-mono);color:var(--muted)}
.kl{display:grid;gap:8px}
.kcard{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--shadow);min-width:0;position:relative}
.kcard[draggable="true"]{cursor:grab}
.kcard.drag{opacity:.45}
.kcard.alta{border-top:2px solid var(--acc)}
.kcard .chips{display:flex;flex-wrap:wrap;gap:4px}
.kcard .chip{font-size:.66rem;padding:2px 7px}
.kt{font:500 .92rem/1.3 var(--f-display);letter-spacing:-.01em}
.kk{font-size:.78rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}


.kf .status{width:100%}
.kcard[data-st="roteirizar"] .status{background:rgba(245,177,76,.12);color:var(--amber)}
.kcard[data-st="gravado"] .status{background:rgba(var(--acc-rgb),.12);color:var(--acc-2)}
.kcard[data-st="no-ar"] .status{background:rgba(61,214,140,.12);color:var(--green)}
.kempty{color:var(--faint);text-align:center;padding:14px 0;font-size:.85rem}
.status:disabled{opacity:.75;cursor:not-allowed}
.sact{display:flex;flex-wrap:wrap;gap:8px}

/* teleprompter */
body.tp-open{overflow:hidden}
.tp{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:grid;grid-template-rows:auto minmax(0,1fr)}
.tpbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(20,20,22,.96);border-bottom:1px solid rgba(255,255,255,.1)}
.tpt{font:500 .95rem var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(42ch,100%)}
.tpc{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tpc .pillbtn{padding:7px 13px;font-size:.82rem}
.tpg{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:#A1A1AA}
.tpg b{min-width:2.4ch;text-align:center;color:#fff;font:500 .86rem var(--f-mono)}
.tpview{overflow-y:auto;scrollbar-width:none;padding:38vh max(20px,6vw) 70vh}
.tpview::-webkit-scrollbar{display:none}
.tptext{max-width:22em;margin:0 auto;font:500 44px/1.35 var(--f-display);letter-spacing:-.01em;transform-origin:center}
.tptext p{margin:0 0 .9em}
.tpw{display:block;font:600 .32em var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc-2);margin-bottom:.3em}
.tpline{position:fixed;left:0;right:0;top:42vh;height:0;border-top:2px solid rgba(var(--acc-rgb),.75);pointer-events:none;box-shadow:0 0 30px rgba(var(--acc-rgb),.5)}
.tphint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:.74rem;color:#7a7a82;white-space:nowrap}

@media (max-width:1000px){ .kb{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(10,10,11,.96)}
  .topbar{grid-template-columns:minmax(0,1fr) auto}
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin:0;grid-column:auto;grid-row:auto;
    padding:6px max(4px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px));background:rgba(14,14,16,.98);border-top:1px solid var(--line);overflow:visible}
  .tab{flex-direction:column;justify-content:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:.66rem;min-width:0}
  .tab .tl,.tab .n{display:none}
  .tab .ts{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tab .ico{width:20px;height:20px}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .flash{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tphint{display:none}
  .tptext{font-size:32px}
  body:not([data-view="panorama"]) main.wrap{padding-top:22px}
}
@media (max-width:620px){
  .kb{grid-template-columns:1fr}
  .kcard[draggable="true"]{cursor:default}
  .vt{margin-left:0}
  
  .brand span:last-child{display:none}
}

.chwrap{padding:16px;border-radius:16px;background:rgba(var(--acc-rgb),.06);border:1px solid rgba(var(--acc-rgb),.18)}
.chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);align-content:start}
.chs b{display:block;font:500 .95rem/1.3 var(--f-display);margin:3px 0 4px}
.chs b small{font:400 .74rem var(--f-mono);color:var(--muted)}
.chs p{margin:0;font-size:.84rem;color:var(--muted)}
.chs .chq{color:var(--ink);font-style:italic;margin-bottom:4px}
.chn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 .74rem var(--f-mono);background:rgba(var(--acc-rgb),.16);color:var(--acc-2)}
.chwhy{margin:12px 0 0;font-size:.88rem;color:var(--muted)}
.chwhy b{color:var(--ink);font-weight:600}
.bpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.bpick label{display:grid;gap:6px;font:500 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bpick select{font:500 .9rem var(--f-body);text-transform:none;letter-spacing:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.bout{border-top:1px solid var(--line-soft);padding-top:14px}
.bshot{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.bshot:first-of-type{border-top:0}
.bshot .tc{font:500 .78rem var(--f-mono);color:var(--muted);display:grid;gap:2px;border:0}
.bshot .tc b{font:600 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--acc-2)}
.bshot .say{font:500 1.02rem/1.4 var(--f-display)}
.bpts{margin:0;padding-left:20px;display:grid;gap:4px;font:500 .98rem/1.4 var(--f-display)}
.bmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.bmeta > div{padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft)}
.bmeta p{margin:4px 0 0;font-size:.84rem;color:var(--muted)}
.rulec{margin-top:18px}
details.more summary{cursor:pointer;font:500 .8rem var(--f-body);color:var(--acc-2);list-style:none;display:inline-flex;align-items:center;gap:6px}

details.more[open] summary::before{content:"–"}
details.more[open] summary{margin-bottom:10px}
details.more > *:not(summary){margin-top:10px}
@media (max-width:860px){ .chain,.bpick,.bmeta{grid-template-columns:1fr} .bshot{grid-template-columns:1fr;gap:4px} }

/* ---- CSV ---- */
function decodeBuf(buf){
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder("utf-16le").decode(b.subarray(2));
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder("utf-16be").decode(b.subarray(2));
  if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return new TextDecoder("utf-8").decode(b.subarray(3));
  return new TextDecoder("utf-8").decode(b);
}
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const toNum = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.-]/g, "")); return isFinite(n) ? n : 0; };
function dailyKey(title){
  const t = norm(title);
  if (/seguidor|follower/.test(t)) return "followers";
  if (/visita|visit/.test(t)) return "visits";
  if (/clique|clic|click/.test(t)) return "clicks";
  if (/interac/.test(t)) return "interactions";
  if (/alcance|reach/.test(t)) return "reach";
  if (/visualiza|view|reproduc/.test(t)) return "views";
  return null;
}
const COLS = {
  id:["identificacao do post","post id","id de la publicacion","identificador de la publicacion"],
  user:["nome de usuario da conta","account username","nombre de usuario de la cuenta"],
  name:["nome da conta","account name","nombre de la cuenta"],
  desc:["descricao","description","descripcion"],
  dur:["duracao (s)","duration (sec)","duration (s)","duracion (s)"],
  time:["horario de publicacao","publish time","hora de publicacion"],
  link:["link permanente","permalink","enlace permanente"],
  type:["tipo de post","post type","tipo de publicacion"],
  views:["visualizacoes","views","visualizaciones","reproducciones"],
  reach:["alcance","reach"],
  likes:["curtidas","likes","me gusta"],
  shares:["compartilhamentos","shares","veces que se compartio","compartidos"],
  follows:["seguimentos","follows","seguimientos"],
  comments:["comentarios","comments"],
  saves:["salvamentos","saves","guardados","veces que se guardo"],
  visits:["visitas ao perfil","profile visits","visitas al perfil"],
  replies:["respostas","replies","respuestas"],
  nav:["navegacao","navigation","navegacion"]
};
function pubDate(s){
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (!m) return String(s).slice(0, 10);
  let a = +m[1], b = +m[2]; const mo = a > 12 ? b : a, d = a > 12 ? a : b;
  return `${m[3]}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function typeKey(s){ const t = norm(s); return /story/.test(t) ? "story" : /reel/.test(t) ? "reel" : /carros|carous|carrus/.test(t) ? "carrossel" : /foto|photo|imag/.test(t) ? "foto" : "post"; }
function classify(rows){
  if (rows.length >= 3 && /^sep=/i.test(rows[0][0])) rows = rows.slice(1);
  const hdrIdx = rows.findIndex(r => r.map(norm).some(h => COLS.id.includes(h)));
  if (hdrIdx >= 0){
    const H = rows[hdrIdx].map(norm), idx = {};
    for (const k in COLS) idx[k] = H.findIndex(h => COLS[k].includes(h));
    const items = rows.slice(hdrIdx + 1).filter(r => r[idx.id]).map(r => {
      const g = k => idx[k] >= 0 ? r[idx[k]] : "";
      const o = {id:g("id"), user:g("user"), name:g("name"), cap:String(g("desc")).replace(/\s+/g, " ").trim().slice(0, 140), dur:toNum(g("dur")), date:pubDate(g("time")), link:g("link"), type:typeKey(g("type"))};
      ["views","reach","likes","shares","follows","comments","saves","visits","replies","nav"].forEach(k => { if (idx[k] >= 0) o[k] = toNum(g(k)); });
      return o;
    });
    return {kind:"content", items};
  }
  if (rows.length >= 2 && rows[0].length === 1){
    const key = dailyKey(rows[0][0]); if (!key) return null;
    const vals = {};
    rows.slice(1).forEach(r => { if (/^\d{4}-\d{2}-\d{2}/.test(r[0] || "")) vals[r[0].slice(0, 10)] = toNum(r[1]); });
    return Object.keys(vals).length ? {kind:"daily", key, vals} : null;
  }
  return null;
}
async function importFiles(fileList){
  if (!igDB) return;
  igMsg = gt("imp_busy"); renderIG();
  const base = IG ? JSON.parse(JSON.stringify(IG)) : {};
  base.account = IG_MAIN; base.daily = base.daily || {}; base.posts = base.posts || {};
  let nd = 0, nc = 0;
  for (const f of fileList){
    try {
      const res = classify(parseCSV(decodeBuf(await f.arrayBuffer())));
      if (!res) continue;
      if (res.kind === "daily"){ base.daily[res.key] = Object.assign(base.daily[res.key] || {}, res.vals); nd++; }
      else { res.items.forEach(it => { base.posts[it.id] = it; }); nc++; }
    } catch(e) { /* skip unreadable file */ }
  }
  if (!nd && !nc){ igMsg = gt("imp_none"); renderIG(); return; }
  base.updatedAt = new Date().toISOString();
  try { await igDB.doc("instagram/current").set(base); igMsg = gt("imp_ok")(nd, nc); }
  catch(e) { igMsg = gt("imp_err"); }
  renderIG();
}

      const pts = days.map((d, i) => `${x(i).toFixed(1)},${y(sv(s.k, d)).toFixed(1)}`).join(" ");
      if (si === 0) m += `<polygon points="${L},${T + ih} ${pts} ${x(days.length - 1).toFixed(1)},${T + ih}" fill="${s.c}" opacity=".14"/>`;
      m += `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
  }
  const hit = days.map((d, i) => `<rect class="hit" data-c="${id}" data-i="${i}" x="${(kind === "bar" ? xb(i) : x(i) - iw / days.length / 2).toFixed(1)}" y="${T}" width="${(iw / days.length).toFixed(1)}" height="${ih}"/>`).join("");
  const hv = igHover && igHover.c === id ? igHover.i : -1;
  const cur = hv >= 0 ? `<line x1="${(kind === "bar" ? xb(hv) + bw / 2 : x(hv)).toFixed(1)}" x2="${(kind === "bar" ? xb(hv) + bw / 2 : x(hv)).toFixed(1)}" y1="${T}" y2="${T + ih}" class="cur"/>` : "";
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.n).join(", "))}">${g}${m}${cur}${hit}</svg>`;
}
function chartCard(title, days, series, kind, id){
  const hv = igHover && igHover.c === id ? days[igHover.i] : null;
  const read = hv ? `<b>${esc(fmtDay(hv, {weekday:"short", day:"2-digit", month:"short"}))}</b> · ` + series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)} ${num(sv(s.k, hv))}</span>`).join(" ") : `<span class="note">${esc(gt("hover"))}</span>`;
  return `<div class="card igc" data-chart="${id}"><div class="head"><h3 style="margin:0">${esc(title)}</h3><span class="rd" id="rd-${id}">${read}</span></div>${chartSVG(days, series, kind, id)}${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>` : ""}</div>`;
}

function renderIG(){
  const box = $("#pbody"); if (!box || panoMode !== "ig") return;
  const head = `<div class="card ighead">
    <div class="igid"><span class="av ig" aria-hidden="true">TH</span><div><div class="nm">@${IG_MAIN}</div><div class="note">${esc(LOCALDB ? xt("ig_s_local") : gt("s"))}</div></div></div>
    ${IG && igStatus === "ok" ? `<div class="igmeta"><span><b>${esc(gt("period"))}</b>${(() => { const d = igDays(); return d.length ? esc(fmtDay(d[0], {day:"2-digit", month:"short", year:"numeric"})) + " – " + esc(fmtDay(d[d.length - 1], {day:"2-digit", month:"short", year:"numeric"})) : "—"; })()}</span><span><b>${esc(gt("updated"))}</b>${IG.updatedAt ? esc(new Intl.DateTimeFormat(LOC[lang], {dateStyle:"medium"}).format(new Date(IG.updatedAt))) : "—"}</span><span><b>${esc(gt("source"))}</b>${esc(gt("src"))}</span></div>` : ""}
    ${igOwner && igDB ? `<div class="igimp"><label class="btn primary" for="ig-file">${svg("upload")}${esc(gt("imp"))}</label><input type="file" id="ig-file" accept=".csv,text/csv" multiple hidden>${IG ? `<button type="button" class="btn" data-dl="ig">${svg("upload")}${esc(ct("dl_ig"))}</button>` : ""}<span class="note">${esc(igMsg || gt("imp_h"))} ${esc(ct("dl_ig_h"))}</span></div>` : ""}
  </div>`;
  if (igStatus !== "ok" || !IG){
    const msg = igStatus === "loading" ? gt("loading") : igStatus === "nodb" ? gt("nodb") : (igOwner ? gt("empty") : gt("empty_v"));
    box.innerHTML = head + `<div class="empty">${esc(msg)}</div>`;
    bindIG(); return;
  }
  const days = igDays(), n = days.length;
  const tot = k => days.reduce((a, d) => a + sv(k, d), 0);
  const win = (k, a, b) => days.slice(Math.max(0, a), Math.max(0, b)).reduce((s, d) => s + sv(k, d), 0);
  const C = {views:"var(--acc)", reach:"var(--bar2)", followers:"var(--acc)", visits:"var(--acc-2)", clicks:"var(--amber)", interactions:"var(--bar2)"};
  const kpis = SERIES.map(k => {
    const cur = win(k, n - 30, n), prev = win(k, n - 60, n - 30), p = n >= 60 ? pct(cur, prev) : null;
    return `<div class="kpi"><span class="eyebrow">${esc(gt("k")[k])}</span><span class="v">${num(tot(k))}</span><span class="d">${p === null ? "&nbsp;" : `<span class="dl ${p < 0 ? "neg" : "pos"}">${p > 0 ? "+" : ""}${num(p)}%</span> ${esc(gt("vs"))}`}</span>${gt("kd")[k] ? `<span class="d">${esc(gt("kd")[k])}</span>` : ""}</div>`;
  }).join("");
  const lastAge = n ? daysAgo(days[n - 1] + "T23:59:59Z") : 0;
  const staleIG = lastAge > 14 ? `<div class="stalebar">${svg("warn")}<span>${esc(xt("ig_stale")(lastAge))}</span></div>` : "";
  const v30 = win("views", n - 30, n), v60 = win("views", n - 60, n - 30), drop = n >= 60 ? pct(v30, v60) : null;
  const alert = drop !== null && drop <= -50 ? `<div class="verdict warn"><div class="vi">${svg("warn")}</div><div><h3>${esc(gt("alert_t"))}</h3><p>${esc(gt("alert_p")(num(v30), num(v60), num(drop) + "%"))}</p><p class="note rule-n">${esc(gt("alert_d"))}</p></div></div>` : "";
  // months
  const months = {}; days.forEach(d => { const m = d.slice(0, 7); (months[m] = months[m] || []).push(d); });
  const mrows = Object.keys(months).sort().map(m => { const ds = months[m], s = k => ds.reduce((a, d) => a + sv(k, d), 0);
    return `<tr><td>${esc(fmtDay(m + "-01", {month:"long", year:"numeric"}))}</td><td class="num">${ds.length}</td>${["views","reach","visits","followers","interactions","clicks"].map(k => `<td class="num">${num(s(k))}<small>${num(s(k) / ds.length, s(k) / ds.length < 10 ? 1 : 0)}/d</small></td>`).join("")}</tr>`; }).join("");
  // posts
  const posts = Object.values(IG.posts || {});
  const feed = posts.filter(p => p.type !== "story");
  const mine = feed.filter(p => p.user === IG_MAIN).sort((a, b) => (b.views || 0) - (a.views || 0));
  const qMed = median(mine.map(p => p.reach ? ((p.saves || 0) + (p.shares || 0)) / p.reach * 100 : null)) || 0;
  const others = {}; feed.filter(p => p.user && p.user !== IG_MAIN).forEach(p => { (others[p.user] = others[p.user] || {name:p.name, list:[]}).list.push(p); });
  const avg = (l, k) => l.length ? l.reduce((a, p) => a + (p[k] || 0), 0) / l.length : 0;
  const oAll = Object.values(others).flatMap(o => o.list);
  const bm = oAll.length && mine.length ? `<div class="card"><div class="head"><h3 style="margin:0">${esc(gt("bm_t"))}</h3></div>
    <p style="margin-bottom:12px">${esc(gt("bm_p")(num(avg(oAll, "views")), num(avg(mine, "views")), num(avg(oAll, "views") / avg(mine, "views"), 1)))}</p>
    <div class="scroll"><table><thead><tr>${gt("bmh").map((h, i) => `<th${i ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>
    <tr class="hi"><td>@${IG_MAIN}</td><td class="num">${mine.length}</td><td class="num">${num(avg(mine, "views"))}</td><td class="num">${num(avg(mine, "reach"))}</td></tr>
    ${Object.entries(others).map(([u, o]) => `<tr><td>@${esc(u)}<small style="display:block">${esc(o.name || "")}</small></td><td class="num">${o.list.length}</td><td class="num">${num(avg(o.list, "views"))}</td><td class="num">${num(avg(o.list, "reach"))}</td></tr>`).join("")}
    </tbody></table></div></div>` : "";
  const ptable = mine.length ? `<div class="card"><div class="head"><h3 style="margin:0">${esc(gt("pt_t"))}</h3><span class="note">${esc(gt("pt_s"))}</span></div>
    <div class="scroll"><table class="posts"><thead><tr>${gt("pth").map((h, i) => `<th${i > 2 ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}<th class="num" title="${esc(xt("qual"))}">${esc(xt("qual_h"))}</th></tr></thead><tbody>
    ${mine.map((p, i) => { const mx = mine[0].views || 1, q = p.reach ? ((p.saves || 0) + (p.shares || 0)) / p.reach * 100 : null; return `<tr><td>${esc(fmtDay(p.date))}</td><td><span class="chip">${esc(gt("types")[p.type] || p.type)}</span></td><td class="cap"><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.cap.slice(0, 70) || "—")}${p.cap.length > 70 ? "…" : ""}</a></td><td class="num"><span class="mb"><i style="width:${((p.views || 0) / mx * 100).toFixed(0)}%"></i></span>${num(p.views || 0)}</td><td class="num">${num(p.reach || 0)}</td><td class="num">${num(p.likes || 0)}</td><td class="num">${num(p.comments || 0)}</td><td class="num">${num(p.shares || 0)}</td><td class="num">${num(p.saves || 0)}</td><td class="num ${q == null ? "" : q >= qMed * 1.1 ? "up" : q <= qMed * .9 ? "dn" : ""}">${q == null ? "—" : num(q, 1) + "%"}</td></tr>`; }).join("")}
    </tbody></table></div><p class="note" style="margin-top:10px">*${esc(xt("qual"))}</p></div>` : "";
  const stories = posts.filter(p => p.type === "story" && (!p.user || p.user === IG_MAIN)).sort((a, b) => b.date.localeCompare(a.date));
  const best = stories.slice().sort((a, b) => (b.views || 0) - (a.views || 0))[0];
  const stc = stories.length ? `<div class="card"><div class="head"><h3 style="margin:0">${esc(gt("st_t"))}</h3><span class="note">${esc(gt("st_s"))}</span></div>
    <div class="kpis" style="margin-bottom:14px">${[[gt("st_k")[0], num(stories.length)], [gt("st_k")[1], num(avg(stories, "views"))], [gt("st_k")[2], num(avg(stories, "reach"))], [gt("st_k")[3], num(best.views || 0) + " · " + fmtDay(best.date)]].map(([a, b]) => `<div class="kpi mini"><span class="eyebrow">${esc(a)}</span><span class="v">${esc(b)}</span></div>`).join("")}</div>
    <div class="scroll" style="max-height:340px;overflow-y:auto"><table><thead><tr>${gt("sth").map((h, i) => `<th${i && i < 5 ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>
    ${stories.map(s => `<tr${s === best ? ' class="hi"' : ""}><td>${esc(fmtDay(s.date))}</td><td class="num">${num(s.views || 0)}</td><td class="num">${num(s.reach || 0)}</td><td class="num">${num(s.replies || 0)}</td><td class="num">${num(s.nav || 0)}</td><td><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(gt("ver"))}</a></td></tr>`).join("")}
    </tbody></table></div></div>` : "";
  // frequência: 28 dias até o último dia com dados
  const endD = n ? days[n - 1] : null, startD = endD ? new Date(new Date(endD + "T12:00:00Z").getTime() - 27 * 864e5).toISOString().slice(0, 10) : null;
  const inWin = p => endD && p.date >= startD && p.date <= endD;
  const cadV = [mine.filter(inWin).length / 4, posts.filter(p => p.type === "story" && (!p.user || p.user === IG_MAIN) && inWin(p)).length / 4];
  const cad = endD ? `<div class="card"><div class="head"><h3 style="margin:0">${esc(xt("cad_t"))}</h3><span class="note">${esc(xt("cad_s"))} · ${esc(fmtDay(startD))} – ${esc(fmtDay(endD))}</span></div>

  box.innerHTML = head + staleIG + `<div class="kpis ig6">${kpis}</div><p class="note limn">${esc(xt("lim"))}</p>` + alert + cad +

    `<div class="grid2">${chartCard(gt("c2"), days, [{k:"followers", n:k.followers, c:C.followers}], "bar", "fo")}${chartCard(gt("c3"), days, [{k:"visits", n:k.visits, c:C.visits}], "bar", "vi")}</div>` +
    `<div class="grid2">${chartCard(gt("c4"), days, [{k:"clicks", n:k.clicks, c:C.clicks}], "bar", "cl")}${chartCard(gt("c5"), days, [{k:"interactions", n:k.interactions, c:C.interactions}], "bar", "in")}</div>` +
    `<div class="card"><div class="head"><h3 style="margin:0">${esc(gt("mt"))}</h3><span class="note">${esc(gt("perday"))}: /d</span></div><div class="scroll"><table class="mt"><thead><tr>${gt("mth").map((h, i) => `<th${i ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>${mrows}</tbody></table></div></div>` +
    ptable + bm + stc;
  bindIG();
}
function bindIG(){
  const fi = $("#ig-file"); if (fi) fi.addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) importFiles(fs); });
  const box = $("#pbody"); if (!box || box.dataset.hb) return; box.dataset.hb = "1";
  const onHit = e => {
    const r = e.target.closest && e.target.closest(".hit"); if (!r || !IG) return;
    const id = r.dataset.c, i = +r.dataset.i;
    if (igHover && igHover.c === id && igHover.i === i) return;
    igHover = {c:id, i};
    const card = box.querySelector(`[data-chart="${id}"]`); if (!card) return;
    const days = igDays(); const k = gt("k");
    const defs = {vr:[[ "views", "line"], ["reach"]], fo:[["followers", "bar"]], vi:[["visits", "bar"]], cl:[["clicks", "bar"]], in:[["interactions", "bar"]]};
    const C = {views:"var(--acc)", reach:"var(--bar2)", followers:"var(--acc)", visits:"var(--acc-2)", clicks:"var(--amber)", interactions:"var(--bar2)"};
    const ser = defs[id].map(([kk]) => ({k:kk, n:k[kk], c:C[kk]}));
    const kind = defs[id][0][1];
    const title = card.querySelector("h3").textContent;
    card.outerHTML = chartCard(title, days, ser, kind, id);
  };
  box.addEventListener("mouseover", onHit);
  box.addEventListener("click", onHit);
}

    const b = e.target.closest(".pill"); if (!b) return;
    if ("g" in b.dataset) refG = b.dataset.g; else refPl = refPl === b.dataset.pl ? "" : b.dataset.pl;
    renderRefs();
  });
}
